<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5주기 정신의료기관 현지평가 D-DAY</title>
<!-- USB 오프라인 송출용: 인터넷 연결 없이 PC 날짜 기준으로 자동 계산 -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f8fd}
  body{
    font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
  }
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#f7f8fd;
  }
  .art{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#f7f8fd;
  }
  .overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .dday{
    position:absolute;
    left:24.2%;
    top:39.2%;
    color:#1d376c;
    font-weight:700;
    font-size:clamp(150px, 17.6vw, 360px);
    line-height:.88;
    letter-spacing:-0.06em;
    white-space:nowrap;
  }
  .date{
    position:absolute;
    left:50%;
    top:70.8%;
    transform:translateX(-50%);
    color:#1d376c;
    font-weight:500;
    font-size:clamp(42px, 5.1vw, 104px);
    letter-spacing:-0.045em;
    white-space:nowrap;
  }


  /* Keep typography aligned to the 2048×1152 original even on different screens */
  @media (max-aspect-ratio: 16/9){
    .overlay{
      width:100%;
      height:56.25vw;
      top:50%;
      transform:translateY(-50%);
    }
  }
  @media (min-aspect-ratio: 16/9){
    .overlay{
      width:177.7778vh;
      height:100%;
      left:50%;
      transform:translateX(-50%);
    }
  }
</style>
</head>
<body>
<div class="stage">
  <img class="art" src="background.jpg" alt="">
  <div class="overlay">
    <div class="dday" id="dday">D-</div>
    <div class="date" id="date">2026. 8. 28. (금)</div>
  </div>
</div>
<script>
const TARGET_DATE = "2026-08-28";
const days = ["일","월","화","수","목","금","토"];

function localDate(str){
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y,m-1,d);
}

function render(){
  const target = localDate(TARGET_DATE);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.ceil((target - today) / 86400000);

  document.getElementById("dday").textContent =
    diff > 0 ? `D-${diff}` : diff === 0 ? "D-DAY" : `D+${Math.abs(diff)}`;

  document.getElementById("date").textContent =
    `${target.getFullYear()}. ${target.getMonth()+1}. ${target.getDate()}. (${days[target.getDay()]})`;
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
