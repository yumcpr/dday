<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5주기 정신의료기관 현지평가 D-DAY</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f8fd}
  body{
    font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
  }
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#f7f8fd;
  }
  .art{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#f7f8fd;
  }
  .overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .dday{
    position:absolute;
    left:24.2%;
    top:39.2%;
    color:#1d376c;
    font-weight:700;
    font-size:clamp(150px, 17.6vw, 360px);
    line-height:.88;
    letter-spacing:-0.06em;
    white-space:nowrap;
  }
  .date{
    position:absolute;
    left:50%;
    top:70.8%;
    transform:translateX(-50%);
    color:#1d376c;
    font-weight:500;
    font-size:clamp(42px, 5.1vw, 104px);
    letter-spacing:-0.045em;
    white-space:nowrap;
  }
  .settings{
    position:fixed;
    right:16px;
    bottom:16px;
    z-index:10;
    border:1px solid rgba(29,55,108,.15);
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(8px);
    color:#1d376c;
    border-radius:999px;
    padding:9px 13px;
    font:700 12px/1 inherit;
    cursor:pointer;
    opacity:.35;
    transition:.2s ease;
  }
  .settings:hover{opacity:1}
  dialog{
    border:0;
    border-radius:18px;
    padding:0;
    width:min(92vw,420px);
    box-shadow:0 24px 70px rgba(0,0,0,.22);
  }
  dialog::backdrop{background:rgba(11,26,52,.35);backdrop-filter:blur(3px)}
  .panel{padding:22px;background:#fff}
  .panel h2{margin:0 0 16px;color:#1d376c;font-size:20px}
  .panel label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#59606a}
  .panel input{
    width:100%;border:1px solid #dce2ea;border-radius:10px;
    padding:11px 12px;font:inherit;margin-bottom:14px;
  }
  .buttons{display:flex;justify-content:flex-end;gap:8px}
  .buttons button{
    border:0;border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer
  }
  .cancel{background:#eef1f5;color:#555}
  .save{background:#1d376c;color:#fff}

  /* Keep typography aligned to the 2048×1152 original even on different screens */
  @media (max-aspect-ratio: 16/9){
    .overlay{
      width:100%;
      height:56.25vw;
      top:50%;
      transform:translateY(-50%);
    }
  }
  @media (min-aspect-ratio: 16/9){
    .overlay{
      width:177.7778vh;
      height:100%;
      left:50%;
      transform:translateX(-50%);
    }
  }
</style>
</head>
<body>
<div class="stage">
  <img class="art" src="background.jpg" alt="">
  <div class="overlay">
    <div class="dday" id="dday">D-</div>
    <div class="date" id="date">2026. 8. 28. (금)</div>
  </div>
  <button class="settings" id="open">날짜 설정</button>
</div>

<dialog id="dialog">
  <form method="dialog" class="panel">
    <h2>D-DAY 날짜 설정</h2>
    <label for="target">현지평가 날짜</label>
    <input id="target" type="date" value="2026-08-28">
    <div class="buttons">
      <button class="cancel" value="cancel">취소</button>
      <button class="save" id="save" value="default">적용</button>
    </div>
  </form>
</dialog>

<script>
const DEFAULT_DATE = "2026-08-28";
const targetInput = document.getElementById("target");
const dialog = document.getElementById("dialog");
const days = ["일","월","화","수","목","금","토"];

function localDate(str){
  const [y,m,d]=str.split("-").map(Number);
  return new Date(y,m-1,d);
}
function currentConfig(){
  const p = new URLSearchParams(location.search);
  return p.get("date") || localStorage.getItem("yumc-eval-date") || DEFAULT_DATE;
}
function render(){
  const s=currentConfig();
  const target=localDate(s);
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.ceil((target-today)/86400000);

  document.getElementById("dday").textContent =
    diff>0 ? `D-${diff}` : diff===0 ? "D-DAY" : `D+${Math.abs(diff)}`;

  document.getElementById("date").textContent =
    `${target.getFullYear()}. ${target.getMonth()+1}. ${target.getDate()}. (${days[target.getDay()]})`;

  targetInput.value=s;
}
document.getElementById("open").onclick=()=>{targetInput.value=currentConfig();dialog.showModal();}
document.getElementById("save").onclick=(e)=>{
  e.preventDefault();
  localStorage.setItem("yumc-eval-date",targetInput.value||DEFAULT_DATE);
  history.replaceState({}, "", location.pathname);
  render();
  dialog.close();
};
render();
setInterval(render,60000);
</script>
</body>
</html>
