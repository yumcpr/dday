<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5주기 의료기관 인증평가 D-Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eef3f8;
      font-family: "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: min(100vw, 1600px);
      aspect-ratio: 16 / 9;
      background:
        radial-gradient(circle at 88% 10%, rgba(218,231,246,.95) 0 8%, rgba(218,231,246,0) 28%),
        radial-gradient(circle at 4% 78%, rgba(226,235,246,.9) 0 8%, rgba(226,235,246,0) 27%),
        linear-gradient(135deg, #ffffff 0%, #fbfdff 45%, #f7fbff 100%);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(27,58,94,.13);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .corner-top {
      position: absolute;
      width: 28%;
      aspect-ratio: 1;
      left: -12%;
      top: -31%;
      border-radius: 50%;
      background: linear-gradient(145deg, #123f89 0%, #0b65b8 100%);
      box-shadow:
        0 0 0 2px rgba(55,150,240,.55),
        0 0 0 26px rgba(255,255,255,.94);
    }

    .corner-top::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      right: 4%;
      bottom: 11%;
      border-radius: 50%;
      background: #1878d1;
      box-shadow: 0 0 0 4px rgba(255,255,255,.92);
    }

    .corner-bottom {
      position: absolute;
      width: 31%;
      aspect-ratio: 1;
      right: -14%;
      bottom: -30%;
      border-radius: 50%;
      background: linear-gradient(145deg, #1f67c8 0%, #06458f 100%);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.92),
        0 0 0 26px rgba(204,224,248,.72);
    }

    .corner-bottom::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 7%;
      top: 13%;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255,255,255,.22);
    }

    .soft-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(106,165,228,.12);
    }
    .soft-circle.one {
      width: 68px;
      height: 68px;
      left: 3.2%;
      top: 51%;
    }
    .soft-circle.two {
      width: 360px;
      height: 360px;
      right: -5%;
      top: -14%;
      background: rgba(109,160,216,.09);
    }

    .dots {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(5, 8px);
      gap: 14px;
      opacity: .55;
    }
    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7fb2ec;
    }
    .dots.top {
      right: 6.5%;
      top: 8.5%;
    }
    .dots.bottom {
      left: 4.2%;
      bottom: 10.5%;
    }

    .wave-lines {
      position: absolute;
      left: 8%;
      right: 7%;
      bottom: -3%;
      height: 24%;
      opacity: .45;
      pointer-events: none;
    }

    .wave-lines::before,
    .wave-lines::after {
      content: "";
      position: absolute;
      inset: 0;
      border-top: 1px solid rgba(91,156,225,.34);
      border-radius: 50%;
      transform: skewX(-15deg) rotate(-4deg);
      box-shadow:
        0 12px 0 rgba(91,156,225,.22),
        0 24px 0 rgba(91,156,225,.18),
        0 36px 0 rgba(91,156,225,.16),
        0 48px 0 rgba(91,156,225,.14),
        0 60px 0 rgba(91,156,225,.12),
        0 72px 0 rgba(91,156,225,.10);
    }

    .wave-lines::after {
      transform: skewX(18deg) rotate(6deg);
      opacity: .6;
      bottom: -30px;
    }

    .content {
      position: relative;
      z-index: 5;
      width: 82%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-1.5%);
    }

    .logo-wrap {
      margin-bottom: 28px;
    }

    .hi-logo-img {
      height: 29px;
      width: auto;
      max-width: 58vw;
      object-fit: contain;
      display: block;
    }

    .title {
      color: #0b2f68;
      font-size: clamp(42px, 4.7vw, 76px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.045em;
      text-align: center;
      text-shadow: 0 7px 18px rgba(17,57,105,.08);
    }

    .divider {
      margin: 28px 0 10px;
      width: 36%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c3d9ef 18%, #c3d9ef 42%, transparent 42%, transparent 58%, #c3d9ef 58%, #c3d9ef 82%, transparent);
      position: relative;
    }

    .divider::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2b86dd;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 0 5px #fff;
    }

    .dday {
      font-size: clamp(110px, 15vw, 235px);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -0.06em;
      color: #e51b23;
      text-shadow: 0 10px 22px rgba(177,28,35,.12);
      margin: 18px 0 28px;
      white-space: nowrap;
    }

    .period {
      padding: 16px 34px 17px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(205,220,235,.5);
      box-shadow: 0 10px 30px rgba(44,79,117,.09);
      color: #163d73;
      font-size: clamp(21px, 2vw, 32px);
      font-weight: 500;
      letter-spacing: -0.035em;
      backdrop-filter: blur(5px);
    }

    .period strong {
      font-weight: 800;
      color: #0b2f68;
    }

    @media (max-width: 900px) {
      .content { width: 88%; }
      .logo-wrap { margin-bottom: 14px; }
      .hi-logo-img { height: 23px; }
      .divider { margin: 18px 0 4px; }
      .dday { margin: 12px 0 20px; }
      .period { padding: 11px 22px 12px; }
    }
  </style>
</head>
<body>

    <div class="corner-top"></div>
    <div class="corner-bottom"></div>
    <div class="soft-circle one"></div>
    <div class="soft-circle two"></div>

    <div class="dots top">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="dots bottom">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

  <script>
    (function calculateDday() {
      const targetDate = new Date(2027, 0, 12);
      const today = new Date();

      const targetMidnight = new Date(
        targetDate.getFullYear(),
        targetDate.getMonth(),
        targetDate.getDate()
      );
      const todayMidnight = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
      );

      const diffTime = targetMidnight - todayMidnight;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const ddayEl = document.getElementById("dday");
      if (!ddayEl) return;

      if (diffDays > 0) {
        ddayEl.textContent = `D-${diffDays}`;
      } else if (diffDays === 0) {
        ddayEl.textContent = "D-DAY";
      } else {
        ddayEl.textContent = `D+${Math.abs(diffDays)}`;
      }
    })();
  </script>
